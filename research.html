  <main class="py-4">
    <div class="container px-4">
      <h2 class="mb-4">Publications</h2>
      <div id="publications-content"></div>

      <h2 class="mb-4 mt-5">Supervised Work</h2>
      <div id="supervised-content">
        <p>Supervised work details will be added here.</p>
      </div>
    </div>
  </main>

  <script>
    fetch('research_data.json')
      .then(response => response.json())
      .then(data => {
        function generateHTML(item) {
          // Support both actual newline and literal '\n' in JSON content.
          const normalizedText = item.text
            .replace(/\r\n/g, '\n')
            .replace(/\\n/g, '\n');
          const lines = normalizedText.split('\n').map(line => line.trim()).filter(Boolean);
          const title = lines.shift() || '';
          const body = lines.join('<br>');
          const linkHTML = item.link ? ' <a href="' + item.link + '" target="_blank" class="text-white">Learn more</a>' : '';
          return '<strong>' + title + '</strong>' + (body ? '<br>' + body : '') + linkHTML;
        }

        // Populate publications
        const pubContainer = document.getElementById('publications-content');
        data.publications.forEach(item => {
          const p = document.createElement('p');
          p.innerHTML = generateHTML(item);
          pubContainer.appendChild(p);
        });

        // Populate supervised work
        const supContainer = document.getElementById('supervised-content');
        supContainer.innerHTML = ''; // Clear placeholder
        data.supervised.forEach(item => {
          const p = document.createElement('p');
          p.innerHTML = generateHTML(item);
          supContainer.appendChild(p);
        });
      })
      .catch(error => {
        console.error('Error loading research data:', error);
        const pubContainer = document.getElementById('publications-content');
        pubContainer.innerHTML = '<p class="text-muted">Unable to load publications content. Please try again later.</p>';
        const supContainer = document.getElementById('supervised-content');
        supContainer.innerHTML = '<p class="text-muted">Unable to load supervised work content. Please try again later.</p>';
      });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

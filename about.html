<body>

<main class="py-5">
  <div class="container px-4">
    
    <!-- Profile Section -->
    <div class="row align-items-start gap-5 mb-5">
      <div class="col-12 col-lg-3">
        <img id="profileImage" src="" alt="Profile" class="img-fluid rounded" style="max-width: 250px; width: 100%; aspect-ratio: 1; object-fit: cover;">
      </div>
      
      <div class="col-12 col-lg-8">
        <div class="mb-4">
          <h2 id="profileTitle" class="h5 mb-2"></h2>
          <p id="profileBio" class="text-muted" style="line-height: 1.7; font-size: 0.95rem;"></p>
        </div>

        <!-- Contact -->
        <div class="d-flex gap-2 align-items-center mb-4">
          <button class="btn btn-outline-light btn-sm" id="contactBtn">contact</button>
        </div>

        <!-- Contact Details Modal -->
        <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content bg-dark border-secondary">
              <div class="modal-header border-secondary">
                <h5 class="modal-title">Contact Information</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body" id="contactModalBody"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Experience Timeline Section -->
    <div class="row mt-5">
      <div class="col-12">
        <h3 class="h6 text-uppercase mb-4">Experience</h3>
        <div id="experienceContainer"></div>
        <div class="text-center mt-4">
          <a id="cvDownloadLink" href="#" class="text-reset opacity-75">download full CV</a>
        </div>
      </div>
    </div>

  </div>
</main>

<style>
  #experienceContainer .experience-entry {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 2rem;
    margin-bottom: 0.25rem;
    padding-bottom: 0.25rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  #experienceContainer .experience-entry:last-child {
    border-bottom: none;
  }

  #experienceContainer .experience-period {
    font-weight: 600;
    font-size: 0.9rem;
    color: #ffffff;
  }

  #experienceContainer .experience-title {
    font-weight: 700;
    font-size: 0.95rem;
    color: #ffffff;
    display: inline;
  }

  #experienceContainer .experience-org {
    font-size: 0.9rem;
    color: #a0a0a0;
    line-height: 1.5;
    display: inline;
    margin-left: 0.7rem;
  }

  @media (max-width: 768px) {
    #experienceContainer .experience-entry {
      grid-template-columns: 1fr;
      gap: 0.5rem;
    }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  async function loadCVData() {
    try {
      const response = await fetch('cv_data.json');
      const cvData = await response.json();
      renderCVPage(cvData);
    } catch (err) {
      console.error('Error loading CV data:', err);
    }
  }

  function renderCVPage(cvData) {
    const { profile, socialLinks, contacts, experience, cvDownloadUrl } = cvData;

    // Render Profile
    document.getElementById('profileImage').src = profile.image;
    document.getElementById('profileTitle').textContent = profile.title;
    document.getElementById('profileBio').textContent = profile.bio;



    // Render Contact Modal
    const contactModalBody = document.getElementById('contactModalBody');
    const contactBtn = document.getElementById('contactBtn');
    if (contacts && contacts.length > 0) {
      contactModalBody.innerHTML = contacts.map(contact => `
        <div class="mb-2">
          <strong>${contact.label}:</strong> 
          <a href="${contact.url}" class="text-reset">${contact.value}</a>
        </div>
      `).join('');
      contactBtn.addEventListener('click', () => {
        new bootstrap.Modal(document.getElementById('contactModal')).show();
      });
    }

    // Render Experience Timeline
    const experienceContainer = document.getElementById('experienceContainer');
    experienceContainer.innerHTML = experience.map(entry => `
      <div class="experience-entry">
        <div class="experience-period">${entry.period}</div>
        <div>
          <div class="experience-title">${entry.title}</div>
          <div class="experience-org">${entry.organization} – ${entry.location}</div>
        </div>
      </div>
    `).join('');

    // Set CV Download Link
    document.getElementById('cvDownloadLink').href = cvDownloadUrl;
  }

  // Initialize
  loadCVData();
</script>

</body>

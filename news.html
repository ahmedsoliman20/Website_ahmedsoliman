<main class="py-4">
  <div class="container px-4">
    
    <div class="sticky-filter-wrapper">
      <div class="d-flex flex-wrap justify-content-start gap-2" id="filter-buttons">
        <button class="btn btn-filter active" data-filter="all">All</button>
        <button class="btn btn-filter" data-filter="Lectures">Lectures</button>
        <button class="btn btn-filter" data-filter="conferences">Conferences</button>
        <button class="btn btn-filter" data-filter="degrees">Degrees</button>
        <button class="btn btn-filter" data-filter="awards">Awards</button>
        <button class="btn btn-filter" data-filter="workshops">Workshops</button>
        <button class="btn btn-filter" data-filter="other">Other</button>
      </div>
    </div>

    <div id="gallery-grid" class="row gx-4 gy-2 mt-1">
      </div>

  </div>
</main>

<!-- Image popup modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-body p-0" style="background: rgba(0,0,0,.85); position: relative;">
        <button id="prevImageBtn" type="button" class="btn btn-outline-light btn-sm" style="position:absolute;top:50%;left:12px;transform:translateY(-50%);z-index:1050;">◀</button>
        <button id="nextImageBtn" type="button" class="btn btn-outline-light btn-sm" style="position:absolute;top:50%;right:12px;transform:translateY(-50%);z-index:1050;">▶</button>
        <div class="d-flex justify-content-center align-items-center p-3" style="min-height: 50vh;">
          <img id="imageModalImg" src="" alt="" class="img-fluid rounded" style="max-height: 65vh; max-width: 100%;" />
        </div>
        <div class="p-3 text-white" style="background: rgba(0,0,0,0.75);">
          <h5 class="mb-2" id="imageModalTitle"></h5>
          <p class="mb-0" id="imageModalDescription"></p>
        </div>
      </div>
      <div class="modal-footer justify-content-center" style="background: rgba(0,0,0,0.75);">
        <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const grid = document.getElementById('gallery-grid');
  let allItems = []; 
  let currentGalleryItems = [];
  let currentGalleryIndex = 0;

  async function loadGallery() {
    let jsonData = { descriptions: {}, newstitles: {}, categories: {} };

    try {
      const jsonRes = await fetch('new.json');
      if (jsonRes.ok) {
        jsonData = await jsonRes.json();
      }
    } catch (err) {
      console.error("Could not load new.json", err);
    }

    const newsKeys = Object.keys(jsonData.newstitles).reverse();

    allItems = newsKeys.map(key => {
      const id = key.split('_')[1];
      return {
        title: jsonData.newstitles[key] || `News Item ${id}`,
        img: `../news/n${id}.jpg`,
        link: `../Projects/Project_${id}/index.html`,
        description: jsonData.descriptions[key] || "",
        // This line checks if 'categories' exists in your JSON for that specific key
        category: (jsonData.categories && jsonData.categories[key]) ? jsonData.categories[key] : "other"
      };
    });

    renderGallery(allItems);
    setupFilters();
  }

  function renderGallery(items) {
    currentGalleryItems = items;
    if (items.length === 0) {
      grid.innerHTML = `<div class="col-12 text-center opacity-50 my-5"><p>No items found in this category.</p></div>`;
      return;
    }

    grid.innerHTML = items.map((item, index) => `
      <div class="col-md-6 col-lg-4 gallery-item">
        <div class="reveal-item" style="animation-delay: ${index * 0.05}s;">
          <div class="tile">
            <div class="img-link" role="button" aria-label="Open ${item.title} in popup">
              <img src="${item.img}" class="gallery-img img-fluid" alt="${item.title}" data-title="${item.title}" data-description="${item.description}" onerror="this.src='https://placehold.co/600x400?text=Image+Not+Found'" style="cursor: zoom-in;">
              <div class="tile-overlay"></div>
              <figcaption class="caption font-bebas">${item.title}</figcaption>
            </div>
          </div>
          <p class="project-description">${item.description}</p>
        </div>
      </div>
    `).join('');
  }

  function setupFilters() {
    const buttons = document.querySelectorAll('.btn-filter');
    
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        // UI Update: Toggle Active Class
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        // Logic: Filter Items
        const filterValue = btn.getAttribute('data-filter').toLowerCase();
        
        if (filterValue === 'all') {
          renderGallery(allItems);
        } else {
          const filtered = allItems.filter(item => 
            item.category.toLowerCase() === filterValue
          );
          renderGallery(filtered);
        }
      });
    });
  }

  function setupImagePopup() {
    const modalEl = document.getElementById('imageModal');
    const modalImg = document.getElementById('imageModalImg');
    const modalTitle = document.getElementById('imageModalTitle');
    if (!modalEl || !modalImg || !modalTitle) return;

    const modal = new bootstrap.Modal(modalEl, { keyboard: true, backdrop: 'static' });

    document.body.addEventListener('click', event => {
      const card = event.target.closest('.img-link');
      if (!card) return;

      const img = card.querySelector('.gallery-img');
      if (!img) return;

      const src = img.getAttribute('src');
      const title = img.getAttribute('data-title') || img.getAttribute('alt') || '';
      const description = img.getAttribute('data-description') || '';

      currentGalleryIndex = currentGalleryItems.findIndex(item => item.img === src);
      if (currentGalleryIndex === -1) currentGalleryIndex = 0;

      modalImg.setAttribute('src', src);
      modalImg.setAttribute('alt', title);
      modalTitle.textContent = title;
      document.getElementById('imageModalDescription').textContent = description;
      modal.show();
    });

    const prevButton = document.getElementById('prevImageBtn');
    const nextButton = document.getElementById('nextImageBtn');

    function showCurrentItem() {
      if (!currentGalleryItems.length) return;
      const item = currentGalleryItems[currentGalleryIndex];
      if (!item) return;
      modalImg.setAttribute('src', item.img);
      modalImg.setAttribute('alt', item.title);
      modalTitle.textContent = item.title;
      document.getElementById('imageModalDescription').textContent = item.description || '';
    }

    prevButton?.addEventListener('click', () => {
      if (currentGalleryItems.length === 0) return;
      currentGalleryIndex = Math.max(0, currentGalleryIndex - 1);
      showCurrentItem();
    });

    nextButton?.addEventListener('click', () => {
      if (currentGalleryItems.length === 0) return;
      currentGalleryIndex = Math.min(currentGalleryItems.length - 1, currentGalleryIndex + 1);
      showCurrentItem();
    });
  }

  // Initialize
  loadGallery();
  setupImagePopup();
</script>

</body>
